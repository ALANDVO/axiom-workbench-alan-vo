name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Run tests
        run: |
          .venv/bin/python -m pytest tests/ -v --cov=app --cov-report=term-missing
        env:
          PYTHONPATH: /home/runner/work/axiom-workbench-alan-vo/axiom-workbench-alan-vo/backend

      - name: Type check
        run: |
          .venv/bin/python -m pip install mypy==1.13.0
          .venv/bin/mypy app/
        env:
          PYTHONPATH: /home/runner/work/axiom-workbench-alan-vo/axiom-workbench-alan-vo/backend

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  docker-build:
    name: Docker Build
    runs-on: ubuntu-24.04
    needs: [backend-test, frontend-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: axiom-workbench-backend:test
          load: true

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: axiom-workbench-frontend:test
          load: true

  compose-up:
    name: Compose Integration Test
    runs-on: ubuntu-24.04
    needs: [docker-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start services
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health; then
              echo "Backend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to become healthy"
          exit 1

      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost/; then
              echo "Frontend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend failed to become healthy"
          exit 1

      - name: Test API
        run: |
          curl -sf http://localhost:8000/api/v1/models | jq -e '.total == 0'
          curl -sf -X POST http://localhost:8000/api/v1/models \
            -H "Content-Type: application/json" \
            -d '{"name":"test-model","display_name":"Test Model","architecture":"sdxl","format":"safetensors","file_path":"/models/test.safetensors","file_size":1000,"hash_sha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}' | jq -e '.id'
          curl -sf http://localhost:8000/api/v1/models | jq -e '.total == 1'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Verify browser registry and restart persistence
        run: python scripts/verify_browser.py

      - name: Service diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=100

      - name: Cleanup
        if: always()
        run: docker compose down -v